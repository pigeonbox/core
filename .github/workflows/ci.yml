name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      # gofmt 门禁（2026-10-22 补）：此前 core/server/p2p/contracts 四个 Go 仓的
      # CI 都没有 gofmt 步，.golangci.yml 也没开 gofmt linter —— 格式漂移无人拦
      # （core 仓 HEAD 上就压着 19 个漂移文件）。**发现即红，修法是 gofmt -w**，
      # 不设豁免：豁免即免死金牌（与前端 api-body-types-check 门禁同族教训）。
      #
      # 2026-10-24 改：下面**每一道门禁都加 `if: always()`** ⇒ 彼此不再阻塞。
      # 此前是串行步骤链 ⇒ **前一步失败 ⇒ 后面全部 skipped** ⇒ 实录：core 仓
      # 压着两个未 gofmt 的文件（我自己的 commit 引入）⇒ gofmt 步红 ⇒
      # Vet / Test(race) / Govulncheck / Lint / **架构棘轮守卫** 全部 skipped
      # ⇒ 整整两个发版列车，那几道门禁**一行断言都没跑过** ⇒ 期间引入的两个
      # 架构违规（规则1 依赖边界 / 规则8 全局配置直读）就这么进了 main。
      # ⇒ **「门禁存在」不等于「门禁跑过」；「前面的失败」也不该让「后面的门禁」
      # 变成不可见**。加 always() 后，一次 CI 能看到**全部**门禁的状态。
      - name: Gofmt
        if: always()
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        if: always()
        run: go vet ./...
      # -race 与本机同门槛:transfer/federation 两起数据竞争都是 CI 外本地才暴露的
      - name: Test (race)
        if: always()
        run: go test -race ./...

      # L8 安全矩阵门禁自证（注入坏形态必须判红）。
      # 判定层（pkg/l8 的 AST 双向对账）已随上面的 `go test -race ./...` 自动生效；
      # 这一步补的是**入口层的负对照**——证明「清单 ↔ 仓内真实测试」的对账判据
      # 不是恒绿（否则清单可以随便写，门禁永远绿）。
      # 挂进既有 test job 的一个 step ⇒ **不改 required checks 名单**。
      - name: L8 安全矩阵门禁自证（注入坏形态必须判红）
        if: always()
        run: bash scripts/check-l8-security-matrix.sh --selfcheck

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # lint 棘轮（.golangci.yml 从 0 issues 起步，只收紧不放宽）
      - name: Lint (golangci-lint)
        if: always()
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14
          args: --timeout 9m
      - name: Dep guard(core 不许依赖下游)
        if: always()
        run: |
          BAD=$(go list -deps ./... | grep -E '^github.com/pigeonbox/(server|frontend|fnos)' || true)
          if [ -n "$BAD" ]; then echo "✗ core 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"

      # ── 换库真库验收（SQLite → Postgres / MySQL）──
      #
      # # 为什么必须是真库（不是 SQLite 替身）
      #
      # 换库最核心的断言是「**导入后新建一行不撞主键**」：
      # 导入是**显式写 ID**（主键与外键才保持不变）⇒ 而
      #   · PG 的 `bigserial` **序列不会**因显式插入而前进
      #   · MySQL 的 `AUTO_INCREMENT` **通常**会自己抬（但行为不保证）
      # ⇒ 不对齐的话，迁移完**第一次新建分享**就撞主键（duplicate key）。
      #
      # SQLite 的 rowid 分配天然是 max(rowid)+1 ⇒ **测不出这个问题**
      # ⇒ 必须用真 PG / 真 MySQL 跑。
      #
      # 本步同时带**负对照**（把 PG 序列推回 1 ⇒ 必须撞主键）
      # ⇒ 证明「对齐有效」那条断言不是「本来就绿」。
      #
      # # 为什么并进 test job 而不是另开一个 job
      #
      # 实录（2026-10-31）：**独立 job 连续四次**在「Set up job」阶段就红，
      # 报错是「Unable to resolve action actions/checkout@<与 main 逐字相同的
      # SHA>」⇒ action 解析失败；同一 run 里 `test` job 解析正常 ⇒ 差异在
      # 「新 job 抢在解析接口抖动时首个启动」这条路径（去掉 job 级 `services:`
      # 仍复现 ⇒ 不是 service 容器的问题）。
      # ⇒ 既然 `test` job 的 action 解析稳定 ⇒ **并进它**，不再新增 job
      # （新增 job = 新增一条 action 解析路径 = 新增一类抖动面）。
      - name: 换库真库验收（SQLite → PG / MySQL）
        if: always()
        env:
          PB_TEST_PG_DSN: "host=127.0.0.1 port=5432 user=pigeonbox password=pbtest dbname=pigeonbox_test sslmode=disable"
          PB_TEST_MYSQL_DSN: "root:pbtest@tcp(127.0.0.1:3306)/pigeonbox_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -uo pipefail
          echo "起 PG / MySQL 容器…"
          docker run -d --name pb-pg -e POSTGRES_USER=pigeonbox -e POSTGRES_PASSWORD=pbtest \
            -e POSTGRES_DB=pigeonbox_test -p 5432:5432 postgres:16-alpine
          docker run -d --name pb-mysql -e MYSQL_ROOT_PASSWORD=pbtest \
            -e MYSQL_DATABASE=pigeonbox_test -p 3306:3306 mysql:8

          echo "等待 PG 就绪…"
          pg_ok=0
          n=0
          while [ "$n" -lt 60 ]; do
            n=$((n + 1))
            if docker exec pb-pg pg_isready -U pigeonbox >/dev/null 2>&1; then pg_ok=1; break; fi
            sleep 2
          done
          echo "等待 MySQL 就绪…"
          my_ok=0
          n=0
          while [ "$n" -lt 90 ]; do
            n=$((n + 1))
            if docker exec pb-mysql mysqladmin ping -uroot -ppbtest >/dev/null 2>&1; then my_ok=1; break; fi
            sleep 2
          done

          # 容器没起来 ⇒ **红**（不是跳过）：跳过 = 假绿 = 真库验收形同虚设。
          if [ "$pg_ok" != "1" ] || [ "$my_ok" != "1" ]; then
            echo "✗ PG 就绪=$pg_ok MySQL 就绪=$my_ok（容器没起来 ⇒ 真库验收无法进行）"
            docker ps -a || true
            exit 1
          fi
          echo "✓ PG / MySQL 就绪"

          go test ./app/dbmigrate/... -run 'TestPG|TestMySQL' -v -count=1

      # ── 存储驱动真机验收（Azure Blob + HDFS）──
      #
      # # 为什么必须有真服务（不是 mock）
      #
      # Azure Blob 驱动是**手写 REST + 手写 SharedKey 签名**，HDFS 驱动是**手写
      # WebHDFS 客户端** ⇒ 两者都只有「单测验签名字符串形态」的覆盖，验不出
      # 「服务端认不认这个请求」。2026-11-02 真机联调（core#36）实测出 **4 个**
      # 真实缺陷，**全部**是「单测全绿、真机不可用」：
      #   · azblob 容器级 URL 缺 "?" ⇒ Probe/List/RemoveAll 全线 400；
      #   · canonicalized resource 查询参数用 name=value ⇒ 403；
      #   · listAll 不查状态码 ⇒ 鉴权失败伪装成「空列表」；
      #   · HDFS List 对缺失目录报错（≠ S3 的空列表）⇒ janitor 孤儿清理不可用。
      #
      # # 为什么并进 test job 而不是另开一个 job
      #
      # 沿用上面「换库真库验收」的既有结论：独立 job 连续多次在「Set up job」
      # 阶段就红（action 解析抖动），而 test job 解析稳定 ⇒ 不新增 action 解析路径。
      #
      # # 真服务不可达 ⇒ **红**（不是跳过）
      #
      # 跳过 = 假绿 = 真机验收形同虚设（同上一道门禁的纪律）。
      # 门禁脚本自身还额外断言「用例不许走 SKIP 分支」。
      - name: 存储驱动真机验收（Azure Blob + HDFS）
        if: always()
        run: bash scripts/live-storage-gate.sh

      # ── L3 集成层：远端存储真后端验收（MinIO / S3 兼容）──
      #
      # # 为什么必须有这一层（L3 = 集成层）
      #
      # 生态质量矩阵 L1–L8 里 L3 是集成层。本仓现状：
      #   · **WebDAV**：进程内真 WebDAV 服务（golang.org/x/net/webdav），
      #     已在普通 `go test ./...` 里真跑（storage/webdav_integration_test.go，
      #     不需要容器、不需要外部服务）；
      #   · **S3 兼容驱动（minio-go）**：此前只有单测级覆盖 + 管理端 probe，
      #     而 probe 只验「桶在不在、凭据对不对」，**从不读写对象** ⇒
      #     真后端的 PUT/GET/DELETE/覆盖写/分片合并/预签名直传直下**从未跑过**。
      # 2026-11-02 Azure Blob + HDFS 真机联调实测出 4 个「单测全绿、真机不可用」
      # 的缺陷（core#36 族）⇒ 同族后端必须有常态化真后端用例。
      #
      # # 为什么并进 test job 而不是另开一个 job
      #
      # 沿用本仓既有结论（见上面「换库真库验收」步的注释）：独立 job 连续多次在
      # 「Set up job」阶段就红（action 解析抖动），而 test job 解析稳定
      # ⇒ 不新增一条 action 解析路径。
      #
      # # 真服务不可达 ⇒ **红**（不是跳过）
      #
      # 跳过 = 假绿 = 真机验收形同虚设（同「换库真库验收」步的纪律）：
      #   · 镜像拉取 / 摘要核对失败 ⇒ 红；
      #   · 容器起不来或不就绪 ⇒ 红；
      #   · 用例走 SKIP 分支 ⇒ 红（grep 断言没跳过）；
      #   · env 缺失 ⇒ 红（PB_REQUIRE_REMOTE_STORAGE=1，与 hub 仓
      #     REQUIRE_SOURCE_METRICS=1 同款纪律：「没扫到」≠「扫过且通过」）。
      #
      # # 镜像钉版
      #
      # tag 钉死（不用 :latest）+ **registry manifest digest 逐字比对**。
      # 为什么不是 `sha256sum -c`：OCI 镜像没有可校验的「单文件」——
      # `docker save` 出来的 tar 摘要随 docker 版本/平台漂移 ⇒ 用 registry
      # manifest digest 比对（与 gitleaks 段「固定期望值比对」的纪律同款；
      # docker pull 本身也按摘要校验过内容）。
      #
      # **镜像源 = quay.io/minio/minio**（MinIO 官方主仓）。2026-11-17 实录：
      # Docker Hub 的 `minio/minio` 已不再提供该 release tag，runner 拉取直接报
      # 「pull access denied for minio/minio, repository does not exist or may
      # require 'docker login'」⇒ 钉在 Docker Hub 上等于这步恒红。
      #
      # **摘要 bootstrap 纪律**：MINIO_SHA_INDEX / MINIO_SHA_AMD64 是**仓内钉版值**；
      # 两者皆空 ⇒ 本步打印实际摘要并**判红**（「没钉版」不许看起来像「钉过了」）
      # ⇒ 首次换镜像源时据此回填，回填后即为逐字比对（供应链门禁）。
      # 两个值分别是多架构 index 与 linux/amd64 单平台 manifest，任一命中即通过。
      - name: L3 远端存储真后端验收（MinIO）
        if: always()
        env:
          PB_TEST_MINIO_ENDPOINT: "127.0.0.1:9000"
          PB_TEST_MINIO_ACCESS_KEY: "pbminio"
          PB_TEST_MINIO_SECRET_KEY: "pbminio123"
          PB_TEST_MINIO_BUCKET: "pigeonbox-l3-test"
          PB_REQUIRE_REMOTE_STORAGE: "1"
        run: |
          set -uo pipefail
          echo "拉 MinIO 镜像（钉版 tag）…"
          docker rm -f pb-minio >/dev/null 2>&1 || true
          MINIO_IMAGE="quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z"
          MINIO_SHA_INDEX=""
          MINIO_SHA_AMD64=""
          if ! docker pull "$MINIO_IMAGE"; then
            echo "✗ MinIO 镜像拉取失败：$MINIO_IMAGE"; exit 1
          fi
          actual_sha="$(docker image inspect --format '{{index .RepoDigests 0}}' "$MINIO_IMAGE" | sed 's/.*@sha256://')"
          ok_pin=0
          for pin in "$MINIO_SHA_INDEX" "$MINIO_SHA_AMD64"; do
            [ -n "$pin" ] || continue
            [ "$actual_sha" = "$pin" ] && ok_pin=1
          done
          if [ "$ok_pin" != "1" ]; then
            if [ -z "$MINIO_SHA_INDEX" ] && [ -z "$MINIO_SHA_AMD64" ]; then
              echo "✗ 镜像摘要尚未钉版（bootstrap）：实际=sha256:$actual_sha"
              echo "  请把该值填回本步的 MINIO_SHA_INDEX（多架构 index 口径）后重跑——钉版即供应链门禁"
            else
              echo "✗ 镜像摘要与钉版不符：实际=sha256:$actual_sha"
              echo "  （期望 多架构 index=$MINIO_SHA_INDEX 或 linux/amd64 manifest=$MINIO_SHA_AMD64）"
            fi
            exit 1
          fi
          echo "✓ 镜像摘要核对通过：sha256:$actual_sha"

          echo "起 MinIO 容器…"
          docker run -d --name pb-minio \
            -e MINIO_ROOT_USER=pbminio -e MINIO_ROOT_PASSWORD=pbminio123 \
            -p 9000:9000 "$MINIO_IMAGE" server /data >/dev/null

          echo "等待 MinIO 就绪…"
          minio_ok=0
          n=0
          while [ "$n" -lt 60 ]; do
            n=$((n + 1))
            if curl -fsS -o /dev/null "http://127.0.0.1:9000/minio/health/live"; then minio_ok=1; break; fi
            sleep 2
          done
          if [ "$minio_ok" != "1" ]; then
            echo "✗ MinIO 未就绪（:9000）"
            docker logs pb-minio 2>&1 | tail -20 || true
            exit 1
          fi
          echo "✓ MinIO 就绪"

          go test ./storage/ -run 'TestMinIOIntegration' -v -count=1 2>&1 | tee /tmp/pb-minio-l3.log
          rc=${PIPESTATUS[0]}

          # 「没扫到」不许看起来像「扫过且通过」：服务已就绪 ⇒ 用例不许走 SKIP。
          if grep -q '^--- SKIP:' /tmp/pb-minio-l3.log; then
            echo "✗ 真机用例被 SKIP（服务已就绪却跳过 ⇒ 判据没真正执行）"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestMinIOIntegration' /tmp/pb-minio-l3.log; then
            echo "✗ 未发现真机用例的执行记录（判据没被执行）"
            exit 1
          fi
          [ "$rc" = "0" ] || { echo "✗ 真机用例失败（rc=$rc）"; exit 1; }
          echo "✓ MinIO 真后端验收通过"

  # 生成物对账（CHECK=1）：沙箱里从 IDL 再生成 gen/ 并与提交物比对，IDL 改了没跑
  # gen-router.sh（或生成物被手改/多出杂散文件）即红。IDL 真相源=contracts，按
  # core go.mod 钉版检出（不用 main，避免 contracts 领先造成假红）；目录布局对齐
  # 本地工作区（../contracts），工具链复用 contracts 的 install-tools.sh——hz 运行时
  # 要调 thriftgo CLI，两个都得装。
  gen-drift:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: Checkout contracts (按 core go.mod 钉版)
        run: |
          VERSION="$(go list -m -f '{{.Version}}' github.com/pigeonbox/contracts)"
          echo "contracts @ ${VERSION}"
          git clone --depth 1 --branch "${VERSION}" \
            https://github.com/pigeonbox/contracts.git "${GITHUB_WORKSPACE}/../contracts"
      - name: Install toolchain (contracts install-tools.sh 装 hz + thriftgo)
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ../contracts/scripts/install-tools.sh
      - name: Gen drift check (CHECK=1, 不落盘)
        run: CHECK=1 ./scripts/gen-router.sh
