name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      # gofmt 门禁（2026-10-22 补）：此前 core/server/p2p/contracts 四个 Go 仓的
      # CI 都没有 gofmt 步，.golangci.yml 也没开 gofmt linter —— 格式漂移无人拦
      # （core 仓 HEAD 上就压着 19 个漂移文件）。**发现即红，修法是 gofmt -w**，
      # 不设豁免：豁免即免死金牌（与前端 api-body-types-check 门禁同族教训）。
      #
      # 2026-10-24 改：下面**每一道门禁都加 `if: always()`** ⇒ 彼此不再阻塞。
      # 此前是串行步骤链 ⇒ **前一步失败 ⇒ 后面全部 skipped** ⇒ 实录：core 仓
      # 压着两个未 gofmt 的文件（我自己的 commit 引入）⇒ gofmt 步红 ⇒
      # Vet / Test(race) / Govulncheck / Lint / **架构棘轮守卫** 全部 skipped
      # ⇒ 整整两个发版列车，那几道门禁**一行断言都没跑过** ⇒ 期间引入的两个
      # 架构违规（规则1 依赖边界 / 规则8 全局配置直读）就这么进了 main。
      # ⇒ **「门禁存在」不等于「门禁跑过」；「前面的失败」也不该让「后面的门禁」
      # 变成不可见**。加 always() 后，一次 CI 能看到**全部**门禁的状态。
      - name: Gofmt
        if: always()
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        if: always()
        run: go vet ./...
      # -race 与本机同门槛:transfer/federation 两起数据竞争都是 CI 外本地才暴露的
      - name: Test (race)
        if: always()
        run: go test -race ./...

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # lint 棘轮（.golangci.yml 从 0 issues 起步，只收紧不放宽）
      - name: Lint (golangci-lint)
        if: always()
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14
          args: --timeout 9m
      - name: Dep guard(core 不许依赖下游)
        if: always()
        run: |
          BAD=$(go list -deps ./... | grep -E '^github.com/pigeonbox/(server|frontend|fnos)' || true)
          if [ -n "$BAD" ]; then echo "✗ core 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"

      # ── 换库真库验收（SQLite → Postgres / MySQL）──
      #
      # # 为什么必须是真库（不是 SQLite 替身）
      #
      # 换库最核心的断言是「**导入后新建一行不撞主键**」：
      # 导入是**显式写 ID**（主键与外键才保持不变）⇒ 而
      #   · PG 的 `bigserial` **序列不会**因显式插入而前进
      #   · MySQL 的 `AUTO_INCREMENT` **通常**会自己抬（但行为不保证）
      # ⇒ 不对齐的话，迁移完**第一次新建分享**就撞主键（duplicate key）。
      #
      # SQLite 的 rowid 分配天然是 max(rowid)+1 ⇒ **测不出这个问题**
      # ⇒ 必须用真 PG / 真 MySQL 跑。
      #
      # 本步同时带**负对照**（把 PG 序列推回 1 ⇒ 必须撞主键）
      # ⇒ 证明「对齐有效」那条断言不是「本来就绿」。
      #
      # # 为什么并进 test job 而不是另开一个 job
      #
      # 实录（2026-10-31）：**独立 job 连续四次**在「Set up job」阶段就红，
      # 报错是「Unable to resolve action actions/checkout@<与 main 逐字相同的
      # SHA>」⇒ action 解析失败；同一 run 里 `test` job 解析正常 ⇒ 差异在
      # 「新 job 抢在解析接口抖动时首个启动」这条路径（去掉 job 级 `services:`
      # 仍复现 ⇒ 不是 service 容器的问题）。
      # ⇒ 既然 `test` job 的 action 解析稳定 ⇒ **并进它**，不再新增 job
      # （新增 job = 新增一条 action 解析路径 = 新增一类抖动面）。
      - name: 换库真库验收（SQLite → PG / MySQL）
        if: always()
        env:
          PB_TEST_PG_DSN: "host=127.0.0.1 port=5432 user=pigeonbox password=pbtest dbname=pigeonbox_test sslmode=disable"
          PB_TEST_MYSQL_DSN: "root:pbtest@tcp(127.0.0.1:3306)/pigeonbox_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -uo pipefail
          echo "起 PG / MySQL 容器…"
          docker run -d --name pb-pg -e POSTGRES_USER=pigeonbox -e POSTGRES_PASSWORD=pbtest \
            -e POSTGRES_DB=pigeonbox_test -p 5432:5432 postgres:16-alpine
          docker run -d --name pb-mysql -e MYSQL_ROOT_PASSWORD=pbtest \
            -e MYSQL_DATABASE=pigeonbox_test -p 3306:3306 mysql:8

          echo "等待 PG 就绪…"
          pg_ok=0
          n=0
          while [ "$n" -lt 60 ]; do
            n=$((n + 1))
            if docker exec pb-pg pg_isready -U pigeonbox >/dev/null 2>&1; then pg_ok=1; break; fi
            sleep 2
          done
          echo "等待 MySQL 就绪…"
          my_ok=0
          n=0
          while [ "$n" -lt 90 ]; do
            n=$((n + 1))
            if docker exec pb-mysql mysqladmin ping -uroot -ppbtest >/dev/null 2>&1; then my_ok=1; break; fi
            sleep 2
          done

          # 容器没起来 ⇒ **红**（不是跳过）：跳过 = 假绿 = 真库验收形同虚设。
          if [ "$pg_ok" != "1" ] || [ "$my_ok" != "1" ]; then
            echo "✗ PG 就绪=$pg_ok MySQL 就绪=$my_ok（容器没起来 ⇒ 真库验收无法进行）"
            docker ps -a || true
            exit 1
          fi
          echo "✓ PG / MySQL 就绪"

          go test ./app/dbmigrate/... -run 'TestPG|TestMySQL' -v -count=1

  # 生成物对账（CHECK=1）：沙箱里从 IDL 再生成 gen/ 并与提交物比对，IDL 改了没跑
  # gen-router.sh（或生成物被手改/多出杂散文件）即红。IDL 真相源=contracts，按
  # core go.mod 钉版检出（不用 main，避免 contracts 领先造成假红）；目录布局对齐
  # 本地工作区（../contracts），工具链复用 contracts 的 install-tools.sh——hz 运行时
  # 要调 thriftgo CLI，两个都得装。
  gen-drift:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Checkout contracts (按 core go.mod 钉版)
        run: |
          VERSION="$(go list -m -f '{{.Version}}' github.com/pigeonbox/contracts)"
          echo "contracts @ ${VERSION}"
          git clone --depth 1 --branch "${VERSION}" \
            https://github.com/pigeonbox/contracts.git "${GITHUB_WORKSPACE}/../contracts"
      - name: Install toolchain (contracts install-tools.sh 装 hz + thriftgo)
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ../contracts/scripts/install-tools.sh
      - name: Gen drift check (CHECK=1, 不落盘)
        run: CHECK=1 ./scripts/gen-router.sh
