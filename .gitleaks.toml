# gitleaks 配置（CI Security Scan 与本地 `gitleaks detect` 自动读取）。
# 默认规则全量继承，仅豁免已核实误报——豁免必须写明理由，禁止无说明扩条。
[extend]
useDefault = true

# 不安全默认密钥黑名单（bootstrap.insecureDefaultSecrets）自身的内容——
# 这些值是公开文档化的"禁止使用"名单，出现在代码/文档里正是守卫生效的证据
[[allowlists]]
description = "不安全默认密钥黑名单的公开占位值"
regexes = [
  '''PigeonBox2025JWT''',
  '''PigeonBox2025SecretKey''',
  '''pigeonbox-dev-signing-key-change-me''',
  '''dev-only-change-me''',
  '''REPLACE_WITH_STRONG_RANDOM_SECRET''',
]

# apikey 中间件测试夹具（随机生成/明文写死的测试 key）
[[allowlists]]
description = "apikey 测试夹具"
paths = ['''^pkg/middleware/apikey_test\.go$''']

# presign/chunk 测试夹具里**明文写死**的签名密钥。
#
# 为什么需要（2026-10-25 实录）：`generic-api-key` 规则按「像密钥的高熵串」判定
# ⇒ 2026-10-24 引入的 chunk 幂等测试里的 `test-presign-signing-key-0123456789`
# 被判成泄露 ⇒ core 的 Secret Scan **从 bd9875f 起一直红**（早于本轮改动）。
#
# 为什么用**值正则**而不是文件路径：路径豁免会放过该文件里的**任何**密钥
# （包括未来误粘贴的真凭据）⇒ 值正则只豁免这一个**确认是测试夹具**的字面量。
[[allowlists]]
description = "presign/chunk 测试夹具的写死签名密钥（非真实凭据）"
regexes = [
  '''test-presign-signing-key-0123456789''',
  '''test-signing-key-0123456789''',
]

# Azurite 的**公开开发密钥**（真机联调用）。
#
# 为什么需要（2026-11-02 core#36 实录）：Azurite 是微软官方的 Azure Blob 模拟器，
# 其默认开发账号/密钥是**公开文档常量**
# （https://learn.microsoft.com/azure/storage/common/storage-use-azurite）⇒
# 真机联调用例必须用它 ⇒ `generic-api-key` 规则按「像密钥的高熵串」判定
# ⇒ Secret Scan 报 "leaks found: 1" ⇒ core 的 Secret Scan 红（实测）。
#
# 为什么用**值正则**而不是文件路径：路径豁免会放过该文件里的**任何**密钥
# （包括未来误粘贴的真凭据）⇒ 值正则只豁免这一个**确认是公开常量**的字面量。
# 该密钥**只能连本机 Azurite**，对任何真实 Azure 账户无效 ⇒ 泄露面为零。
[[allowlists]]
description = "Azurite 公开开发密钥（真机联调用，公开文档常量，对真实 Azure 无效）"
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]

# OIDC ClientSecret 收编（core#81）测试夹具：混淆持有器的哨兵值。
# 为什么需要：generic-api-key 按「变量名带 secret + 高熵值」判定 ⇒ secure_test.go
# 的 fixture 常量被判成泄露。为什么用值正则：只豁免这一个确认是测试哨兵的
# 字面量，未来误粘贴真凭据仍会被抓。
[[allowlists]]
description = "OIDC secret 持有器测试哨兵（非真实凭据）"
regexes = [
  '''oidc-secret-marker-9f2b''',
]
